name: Run tests

on:
  push:
  schedule:
    - cron: '0 0 * * *'

jobs:
  php-tests:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        php: [8.1, 8.2, 8.3, 8.4, 8.5 ]
        laravel: [ 9.*, 10.*, 11.*, 12.* ]
        dependency-version: [ prefer-stable ]
        os: [ ubuntu-latest ]
        exclude:
          - laravel: 11.*
            php: 8.1
          - laravel: 11.*
            php: 8.5
          - laravel: 12.*
            php: 8.1
          - laravel: 10.*
            php: 8.4
          - laravel: 10.*
            php: 8.5
          - laravel: 9.*
            php: 8.1
        include:
          - laravel: 9.*
            testbench: ^7.56
          - laravel: 10.*
            testbench: ^8.22
          - laravel: 11.*
            testbench: ^9.5
          - laravel: 12.*
            testbench: ^10.5

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: xdebug

      - name: Install dependencies
        run: |
          # Laravel 9.52.21 is EOL and flagged by Composer advisories, but we still
          # need it to verify package compatibility on Laravel 9.
          if [ "${{ matrix.laravel }}" = "9.*" ]; then
            composer config policy.advisories.block false
          fi

          composer require \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/container:${{ matrix.laravel }}" \
            "illuminate/database:${{ matrix.laravel }}" \
            "illuminate/pagination:${{ matrix.laravel }}" \
            --no-interaction \
            --no-update

          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update

          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Execute tests
        run: make test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./tests/build/logs/clover.xml