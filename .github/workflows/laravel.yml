name: Run tests

on:
  push:
  schedule:
    - cron: '0 0 * * *'

jobs:
  php-tests:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        php: [8.1, 8.2, 8.3, 8.4, 8.5]
        laravel: ['9.*', '10.*', '11.*', '12.*', '13.*']
        dependency-version: [prefer-stable]
        os: [ubuntu-latest]
        exclude:
          - laravel: 11.*
            php: 8.1
          - laravel: 11.*
            php: 8.5
          - laravel: 12.*
            php: 8.1
          - laravel: 10.*
            php: 8.4
          - laravel: 10.*
            php: 8.5
          - laravel: 9.*
            php: 8.1
          - laravel: 13.*
            php: 8.1
          - laravel: 13.*
            php: 8.2

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick

      - name: Install dependencies
        run: |
          case "${{ matrix.laravel }}" in
            9.*)  TESTBENCH="^7.0" ;;
            10.*) TESTBENCH="^8.0" ;;
            11.*) TESTBENCH="^9.0" ;;
            12.*) TESTBENCH="^10.0" ;;
          esac

          composer require \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/container:${{ matrix.laravel }}" \
            "illuminate/database:${{ matrix.laravel }}" \
            "illuminate/pagination:${{ matrix.laravel }}" \
            --no-interaction \
            --no-update

          composer require "orchestra/testbench:${TESTBENCH}" --dev --no-interaction --no-update

          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit -c phpunit.ci.xml
